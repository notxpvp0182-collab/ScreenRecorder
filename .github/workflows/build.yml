name: Build OBS Mod JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download & Bundle Real Static FFmpeg Binaries (ARMv7 + ARM64) into Mod JAR
        run: |
          mkdir -p src/main/resources/assets/screen_recorder/bin

          echo "Downloading verified static FFmpeg for ARMv7 (32-bit Android/Linux)..."
          curl -L --fail -o src/main/resources/assets/screen_recorder/bin/ffmpeg-arm \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-arm" || \
          curl -L --fail -o src/main/resources/assets/screen_recorder/bin/ffmpeg-arm \
            "https://raw.githubusercontent.com/ebe123/ffmpeg-bin/master/ffmpeg-arm" || true

          echo "Downloading verified static FFmpeg for ARM64 (64-bit Android/Linux)..."
          curl -L --fail -o src/main/resources/assets/screen_recorder/bin/ffmpeg-arm64 \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-arm64" || true

          chmod +x src/main/resources/assets/screen_recorder/bin/* || true
          ls -lh src/main/resources/assets/screen_recorder/bin/

          cat << 'JAVAEOF' > MakeAssets.java
          import java.awt.*;
          import java.awt.geom.*;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import javax.imageio.ImageIO;
          public class MakeAssets {
              public static void main(String[] args) throws Exception {
                  int s = 256;
                  BufferedImage img = new BufferedImage(s, s, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = img.createGraphics();
                  g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                  g.setColor(new Color(20, 22, 28));
                  g.fill(new Ellipse2D.Double(6, 6, 244, 244));
                  g.setStroke(new BasicStroke(10f));
                  g.setColor(new Color(230, 234, 240));
                  g.draw(new Ellipse2D.Double(10, 10, 236, 236));
                  g.setColor(Color.WHITE);
                  for (int i = 0; i < 3; i++) {
                      AffineTransform old = g.getTransform();
                      g.rotate(Math.toRadians(i * 120), 128, 128);
                      g.fill(new Arc2D.Double(56, 36, 112, 112, 20, 135, Arc2D.CHORD));
                      g.setTransform(old);
                  }
                  g.setColor(new Color(20, 22, 28));
                  g.fill(new Ellipse2D.Double(104, 104, 48, 48));
                  g.dispose();
                  ImageIO.write(img, "PNG", new File("src/main/resources/assets/screen_recorder/icon.png"));
                  ImageIO.write(img, "PNG", new File("src/main/resources/icon.png"));
              }
          }
          JAVAEOF
          javac MakeAssets.java && java MakeAssets && rm -f MakeAssets.java MakeAssets.class

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Built JAR
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Mod-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
