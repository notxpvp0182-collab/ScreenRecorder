name: Build Fabric Mod JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bundle Native FFmpeg Binaries into Mod Resources
        run: |
          mkdir -p src/main/resources/assets/screen_recorder/bin
          curl -L -s https://github.com/ewanull/ffmpeg-android-arm64/raw/main/ffmpeg -o src/main/resources/assets/screen_recorder/bin/ffmpeg-arm64 || true
          chmod +x src/main/resources/assets/screen_recorder/bin/* || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Built JAR
        uses: actions/upload-artifact@v4
        with:
          name: Screen-Recorder-Mod-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
