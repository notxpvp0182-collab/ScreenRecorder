name: Build OBS Mod JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Official OBS Studio PNG Icon & Clean Resources
        run: |
          rm -rf src/main/resources/assets/screen_recorder/lut
          mkdir -p src/main/resources/assets/screen_recorder/bin

          cat << 'JAVAEOF' > MakeAssets.java
          import java.awt.*;
          import java.awt.geom.*;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import javax.imageio.ImageIO;
          public class MakeAssets {
              public static void main(String[] args) throws Exception {
                  int s = 256;
                  BufferedImage img = new BufferedImage(s, s, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = img.createGraphics();
                  g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                  g.setColor(new Color(20, 22, 28));
                  g.fill(new Ellipse2D.Double(6, 6, 244, 244));
                  g.setStroke(new BasicStroke(10f));
                  g.setColor(new Color(230, 234, 240));
                  g.draw(new Ellipse2D.Double(10, 10, 236, 236));
                  g.setColor(Color.WHITE);
                  for (int i = 0; i < 3; i++) {
                      AffineTransform old = g.getTransform();
                      g.rotate(Math.toRadians(i * 120), 128, 128);
                      g.fill(new Arc2D.Double(56, 36, 112, 112, 20, 135, Arc2D.CHORD));
                      g.setTransform(old);
                  }
                  g.setColor(new Color(20, 22, 28));
                  g.fill(new Ellipse2D.Double(104, 104, 48, 48));
                  g.dispose();
                  ImageIO.write(img, "PNG", new File("src/main/resources/assets/screen_recorder/icon.png"));
                  ImageIO.write(img, "PNG", new File("src/main/resources/icon.png"));
              }
          }
          JAVAEOF
          javac MakeAssets.java && java MakeAssets && rm -f MakeAssets.java MakeAssets.class

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Uncompressed JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Mod-JAR
          compression-level: 0
          path: |
            build/libs/OBS-1.21.11.jar

      - name: Publish Direct Downloadable OBS-1.21.11.jar to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OBS Studio Mod 1.21.11 (Direct JAR Download)"
          files: build/libs/OBS-1.21.11.jar
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
