name: Build OBS Mod JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official OBS Icon & Native FFmpeg
        run: |
          mkdir -p src/main/resources/assets/screen_recorder/bin
          curl -L -s "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/OBS_Studio_Logo.svg/256px-OBS_Studio_Logo.svg.png" -o src/main/resources/assets/screen_recorder/icon.png || true
          curl -L -s "https://github.com/AlwaysLivid/ffmpeg-android-arm64-static/releases/latest/download/ffmpeg" -o src/main/resources/assets/screen_recorder/bin/ffmpeg-arm64 || true
          chmod +x src/main/resources/assets/screen_recorder/bin/* || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Built JAR
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Mod-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
